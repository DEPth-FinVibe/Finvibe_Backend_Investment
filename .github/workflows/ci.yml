name: CI - Build & Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Backend Repo Checkout
      - name: Checkout backend repository
        uses: actions/checkout@v4

      # 2️⃣ JDK 21 설정
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3️⃣ Gradle 캐시 설정
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4️⃣ application 설정 파일 주입 (Secrets)
      - name: Create application config files
        run: |
          mkdir -p src/main/resources
          mkdir -p src/test/resources

          echo "${{ secrets.APPLICATION_YAML }}" > src/main/resources/application.yaml
        
      # 5️⃣ Gradle Build (Test 포함)
      - name: Build with Gradle
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
        run: ./gradlew clean build --no-daemon

      # 6️⃣ Docker Hub 로그인
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 7️⃣ 이미지 태그 생성 (commit sha 7자리)
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 8️⃣ Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/finvibe:${{ env.IMAGE_TAG }} \
            -f deploy/Dockerfile .

      # 9️⃣ Docker Hub Push
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/ncareer:${{ env.IMAGE_TAG }}
